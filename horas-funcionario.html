<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas horas — CLIC</title>
  <meta name="description" content="CLIC — controle financeiro, projetos, horas e reembolsos.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<script>/* guarda de sessão: roda antes da tela pintar */(function(){try{if(!sessionStorage.getItem("clic.sessao")&&!localStorage.getItem("clic.sessao")){location.replace("entrar.html");}}catch(e){}})();</script>
<div class="clic-app">
  <aside class="clic-sidebar" id="sidebar" aria-label="Menu lateral">
    <a class="clic-sidebar__logo" href="horas-funcionario.html" aria-label="CLIC">
      <img src="assets/img/logo-oficial-dark.png" alt="CLIC" width="120" height="144">
    </a>
    <nav class="clic-sidebar__menu" aria-label="Navegação do sistema">
      <a class="clic-menu-btn ativo" href="horas-funcionario.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11v6"/><path d="M9 14h6"/></svg>Horas</a>
    </nav>
    <div class="clic-sidebar__perfil">
      <span class="clic-sidebar__avatar">LW</span>
      <span class="clic-sidebar__nome">Lucas Willian</span>
      <span class="clic-sidebar__cargo">Funcionário</span>
      <a class="clic-sidebar__sair" href="entrar.html" data-sair>Sair</a>
    </div>
  </aside>
  <main class="clic-app__main">
    <div class="app-topo">
      <h1 class="clic-app__titulo">Minhas horas</h1>
      <span class="app-aviso">Você vê apenas os seus lançamentos</span>
    </div>

    <div class="app-horas-grid">
      <section class="cronometro" id="cronometro" data-estado="ocioso" aria-label="Cronômetro">
        <p class="cronometro__rotulo">Cronômetro · Projeto Alfa · 26038</p>
        <p class="cronometro__tempo" id="cronometro-tempo">00:42:17</p>
        <div class="cronometro__acoes">
          <button class="cronometro__btn cronometro__btn--primario" id="btn-iniciar" type="button">Pausar</button>
          <button class="cronometro__btn cronometro__btn--contorno" id="btn-finalizar" type="button">Finalizar</button>
        </div>
      </section>

      <section class="registro-manual" aria-label="Registro manual">
        <h2 class="registro-manual__titulo">Registro manual</h2>
        <form id="form-registro">
          <div class="registro-manual__linha">
            <select class="clic-input clic-input--select" id="reg-projeto" aria-label="Projeto">
              <option>Projeto Alfa</option><option>Projeto Beta</option>
            </select>
            <input class="clic-input" id="reg-codigo" value="24014" aria-label="Código">
            <input class="clic-input" id="reg-data" type="date" value="2026-10-14" aria-label="Data">
            <input class="clic-input" id="reg-inicio" type="time" value="09:00" aria-label="Início">
            <input class="clic-input" id="reg-fim" type="time" value="12:30" aria-label="Fim">
          </div>
          <div class="registro-manual__linha--desc">
            <input class="clic-input" id="reg-descricao" placeholder="Descrição: o que foi feito" aria-label="Descrição">
            <button class="clic-btn-app" type="submit">Salvar registro</button>
          </div>
        </form>
      </section>
    </div>

    <div class="app-filtros app-filtros--horas">
      <select class="clic-input clic-input--select" id="f-periodo" aria-label="Período">
        <option value="semana">Período: semana atual</option>
        <option value="mes">Período: este mês</option>
        <option value="todos">Período: todo o histórico</option>
      </select>
      <select class="clic-input clic-input--select" id="f-projeto" aria-label="Projeto"></select>
      <select class="clic-input clic-input--select" id="f-centro" aria-label="Centro de custo"></select>
      <span class="app-total" id="horas-total">Total no período: 0h00</span>
    </div>

    <div class="clic-tabela-wrap">
      <div class="table-responsive">
        <table class="clic-tabela" id="tabela-horas" data-escopo="proprio">
          <thead>
            <tr><th>Data</th><th>Projeto</th><th>Centro de custo</th><th>Descrição</th><th>Início</th><th>Fim</th><th>Horas</th><th>Ações</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
<script src="js/sessao.js" defer></script>
<script src="js/formatadores.js" defer></script>
<script src="js/dados.js" defer></script>
<script src="js/toasts.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/horas.js" defer></script>
<script src="js/timer.js" defer></script>
</body>
</html>
