  <main class="clic-app__main">
    <div class="app-topo">
      <h1 class="clic-app__titulo">Horas trabalhadas</h1>
    </div>

    <div class="app-horas-grid">
      <section class="cronometro" id="cronometro" data-estado="ocioso" aria-label="Cronômetro">
        <p class="cronometro__rotulo">Cronômetro · Projeto Alfa · 26038</p>
        <p class="cronometro__tempo" id="cronometro-tempo">00:00:00</p>
        <div class="cronometro__acoes">
          <button class="cronometro__btn cronometro__btn--primario" id="btn-iniciar" type="button">Iniciar</button>
          <button class="cronometro__btn cronometro__btn--contorno" id="btn-finalizar" type="button" hidden>Finalizar</button>
        </div>
      </section>

      <section class="registro-manual" aria-label="Registro manual">
        <h2 class="registro-manual__titulo">Registro manual</h2>
        <form id="form-registro">
          <div class="registro-manual__linha">
            <select class="clic-input clic-input--select" id="reg-projeto" aria-label="Projeto">
              <option>Projeto</option><option>Projeto Alfa</option><option>Projeto Beta</option>
            </select>
            <input class="clic-input" id="reg-codigo" placeholder="Código" aria-label="Código">
            <input class="clic-input" id="reg-data" type="date" aria-label="Data">
            <input class="clic-input" id="reg-inicio" type="time" aria-label="Início">
            <input class="clic-input" id="reg-fim" type="time" aria-label="Fim">
          </div>
          <div class="registro-manual__linha--desc">
            <input class="clic-input" id="reg-descricao" placeholder="Descrição" aria-label="Descrição">
            <button class="clic-btn-app" type="submit">Salvar registro</button>
          </div>
        </form>
      </section>
    </div>

    <div class="app-filtros app-filtros--horas" id="filtros-horas">
      <select class="clic-input clic-input--select" id="f-periodo" aria-label="Período">
        <option value="semana">Período: semana atual</option>
        <option value="mes">Período: este mês</option>
        <option value="todos">Período: todo o histórico</option>
      </select>
      <select class="clic-input clic-input--select" id="f-colaborador" aria-label="Colaborador"></select>
      <select class="clic-input clic-input--select" id="f-projeto" aria-label="Projeto"></select>
      <select class="clic-input clic-input--select" id="f-centro" aria-label="Centro de custo"></select>
    </div>

    <div class="clic-tabela-wrap">
      <div class="table-responsive">
        <table class="clic-tabela" id="tabela-horas">
          <thead>
            <tr><th>Data</th><th>Projeto</th><th>CC</th><th>Colaborador</th><th>Descrição</th><th>Início</th><th>Fim</th><th>Horas</th><th class="num">Custo</th><th>Ações</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
